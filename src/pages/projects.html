<!DOCTYPE html>
<html lang="id" class="scroll-smooth" id="html-root">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects | Imran Darajati</title>

    <link rel="icon" type="image/png" href="/favicon.png" />
  </head>
  <!-- Menghapus scroll bar default agar animasi sticky lebih mulus -->
  <body class="bg-white dark:bg-[#0a0a0a] text-gray-900 dark:text-slate-200 font-sans antialiased selection:bg-violet-200 dark:selection:bg-violet-900 selection:text-violet-900 dark:selection:text-white transition-colors duration-300">

    <div id="header-placeholder"></div>

    <!-- HEADER PROJECTS -->
    <section class="px-6 py-20 text-center max-w-4xl mx-auto">
      <h1 class="text-6xl md:text-7xl font-extrabold text-gray-900 dark:text-white tracking-tight mb-6">
        My <span class="text-violet-600">Best</span> Creations
      </h1>
      <p class="text-xl md:text-2xl text-gray-500 dark:text-gray-400 font-medium">
        Designing and Developing Robust and Stylish Web Applications.
      </p>
    </section>

<!-- WADAH STICKY SCROLLING -->
    <div id="sticky-container" class="relative w-full max-w-7xl mx-auto px-4 sm:px-6">
      <!-- Data proyek dari Supabase akan diisi ke sini oleh main.js -->
    </div>
    
    <!-- TRIK RAHASIA: -mt-[50vh] menarik footer ke atas untuk menutupi ruang kosong -->
    <div class="relative w-full bg-white dark:bg-[#0a0a0a] z-[100] -mt-[50vh]">
      <div id="footer-placeholder"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
